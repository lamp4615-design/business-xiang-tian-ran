name: 更新商品清單

# 每 15 分鐘從 Apps Script 抓一次商品資料，存成 products.json（網站載入時優先讀這個靜態檔，速度快很多）
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 抓取商品資料
        run: |
          API="https://script.google.com/macros/s/AKfycbyZqvkluw1OoigP2Bw_KmkqyKPzlklCWHu57MGLOULH5EVI0ctTmnw5d4WZgZU7wy-iuQ/exec?action=products"
          curl -sSL --retry 3 --max-time 60 "$API" -o new.json
          # 必須是非空陣列才採用，避免 API 出錯時把網站商品清空
          jq -e 'type=="array" and length>0' new.json > /dev/null
          jq -c . new.json > products.json
          rm new.json
      - name: 有變動才 commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.json
          git diff --cached --quiet || (git commit -m "自動更新商品清單" && git push)
