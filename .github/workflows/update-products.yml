name: 更新商品清單

# 每 15 分鐘從 Apps Script 抓一次商品資料，存成 products.json（網站載入時優先讀這個靜態檔，速度快很多）
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 抓取商品資料
        run: |
          API="https://script.google.com/macros/s/AKfycbyZqvkluw1OoigP2Bw_KmkqyKPzlklCWHu57MGLOULH5EVI0ctTmnw5d4WZgZU7wy-iuQ/exec?action=products"
          ok=0
          for i in 1 2 3; do
            rm -f new.json; curl -sSL --max-time 120 -A "Mozilla/5.0" "$API" -o new.json || true
            # 必須是非空陣列才採用，避免 API 出錯時把網站商品清空
            if jq -e 'type=="array" and length>0' new.json > /dev/null 2>&1; then ok=1; break; fi
            echo "第 $i 次抓到的不是商品陣列，內容開頭："; head -c 400 new.json 2>/dev/null; echo
            sleep 10
          done
          [ "$ok" = 1 ] || { echo "放棄：保留原有 products.json"; exit 1; }
          jq -c . new.json > products.json
          rm new.json
      - name: 有變動才 commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.json
          git diff --cached --quiet || (git commit -m "自動更新商品清單" && git push)
